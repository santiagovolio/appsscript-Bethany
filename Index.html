<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,50&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /*
   * Proyecto Bethany: sistema visual
   * Base: salvia pálido (fondo) y papel blanco (superficies). Tinta: verde bosque. Acento: dorado del logo.
   * Tipografía: Fraunces (títulos y cifras) y Figtree (interfaz y lectura).
   * Lo memorable: la franja de semanas del cuatrimestre y los tokens como monedas. Todo lo demás, sobrio.
   */
  :root {
    --bosque: #1d3328; --bosque-2: #284536; --bosque-3: #3b5a49;
    --musgo: #4f5e45; --salvia: #8c9171; --salvia-clara: #e3e7da;
    --fondo: #eceee5; --crema: #f5f6f0; --arena: #e4e7dc; --papel: #fdfdfa;
    --oro: #c4a061; --oro-osc: #8a6a2f; --oro-clara: #f3e9d4;
    --texto: #1f2a23; --suave: #5f6a5c; --linea: #dfe2d6; --linea-2: #cfd4c4; --campo: #c9cebd;
    --ok: #33623f; --ok-clara: #e5efe3; --mal: #a3473c; --mal-clara: #f8e6e1; --aviso: #7a5a1e; --aviso-clara: #f6ecd6;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radio: 16px; --radio-s: 10px;
    --sombra: none;
    --sombra-alta: 0 2px 6px rgba(29, 51, 40, .06), 0 24px 48px -12px rgba(29, 51, 40, .28);
    --curva: cubic-bezier(.22, .8, .24, 1);
    --foco: 0 0 0 3px var(--papel), 0 0 0 5px var(--bosque);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: var(--sans); background: var(--fondo); color: var(--texto); font-size: 16px; line-height: 1.55;
         -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; }
  ::selection { background: var(--oro-clara); color: var(--bosque); }
  strong { font-weight: 650; }

  /* Encabezado */
  header.barra { display: none; position: sticky; top: 0; z-index: 5; background: var(--bosque); color: var(--crema);
                 padding: 0 20px; height: 64px; align-items: center; justify-content: space-between; gap: 12px; }
  body.con-sesion header.barra { display: flex; }
  .marca { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .marca img { height: 36px; width: auto; display: block; }
  .marca-texto { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; padding-left: 12px; border-left: 1px solid rgba(245, 246, 240, .2); }
  .marca-texto strong { font-family: var(--serif); font-weight: 500; font-size: 19px; letter-spacing: -.1px; white-space: nowrap;
                        font-variation-settings: "opsz" 36, "SOFT" 50; }
  .marca-texto span { font-size: 12.5px; color: var(--oro); font-weight: 500; margin-top: 2px; }
  #usuario { font-size: 14px; display: flex; gap: 14px; align-items: center; }
  #usuario .nombre { color: rgba(245, 246, 240, .82); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
  #usuario .salir { background: transparent; color: var(--crema); border: 1px solid rgba(245, 246, 240, .3); min-height: 36px;
                    padding: 6px 14px; font-size: 13.5px; font-weight: 500; border-radius: 8px; box-shadow: none; }
  #usuario .salir:hover { background: rgba(245, 246, 240, .08); border-color: rgba(245, 246, 240, .6); }
  #usuario .salir:focus-visible { box-shadow: 0 0 0 2px var(--bosque), 0 0 0 4px var(--oro); }

  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 96px; }

  /* Escala tipográfica (1.25): 13 · 14.5 · 16 · 20 · 26 · 36 */
  h2 { font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.08; margin: 0 0 20px; color: var(--bosque);
       letter-spacing: -.6px; font-variation-settings: "opsz" 96, "SOFT" 50; text-wrap: balance; }
  h3 { font-family: var(--serif); font-weight: 500; font-size: 22px; line-height: 1.2; margin: 0 0 12px; color: var(--bosque);
       letter-spacing: -.2px; font-variation-settings: "opsz" 36, "SOFT" 50; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .modal h3, .acceso h2 { margin-top: 0; }
  h4 { font-size: 15px; font-weight: 650; color: var(--musgo); margin: 28px 0 2px; display: flex; align-items: center; gap: 12px; }
  h4::after { content: ""; flex: 1; height: 1px; background: var(--linea); }
  .tarjeta > h4:first-child, form > h4:first-child { margin-top: 8px; }

  .tarjeta { background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); padding: 24px; margin-bottom: 16px; }
  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .rejilla .tarjeta { margin-bottom: 0; }

  /* Tokens del mes: monedas */
  .tarjeta-dias { padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "et et" "cifra fichas" "exc exc"; align-items: end; column-gap: 12px; }
  .tarjeta-dias > .suave:first-child { grid-area: et; font-size: 14px; }
  .tarjeta-dias .cifra { grid-area: cifra; }
  .tarjeta-dias .fichas { grid-area: fichas; margin: 0 0 6px; }
  .tarjeta-dias .exc-linea { grid-area: exc; }
  .cifra { font-family: var(--serif); font-size: 52px; font-weight: 500; color: var(--bosque); line-height: 1; margin-top: 10px;
           letter-spacing: -1.5px; font-variation-settings: "opsz" 144, "SOFT" 50; font-variant-numeric: lining-nums; }
  .cifra .suave { font-family: var(--sans); font-size: 15px; font-weight: 500; letter-spacing: 0; margin-left: 2px; }
  .fichas { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .fichas span { width: 26px; height: 26px; border-radius: 50%; position: relative;
                 background: radial-gradient(circle at 35% 30%, #e7cf98, var(--oro) 55%, #a9843f);
                 box-shadow: inset 0 0 0 1px rgba(122, 90, 30, .35), 0 1px 1px rgba(29, 51, 40, .12); }
  .fichas span::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid rgba(255, 248, 228, .55); }
  .fichas span.usada { background: transparent; box-shadow: inset 0 0 0 1.5px var(--campo); }
  .fichas span.usada::after { border: 0; inset: 50% 6px auto; height: 1.5px; background: var(--campo); transform: rotate(-45deg); border-radius: 0; }
  #s-cuenta { text-align: right; font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .exc-linea { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linea); font-size: 14px; color: var(--suave); }
  .exc-linea strong { color: var(--oro-osc); }
  .medidor { height: 6px; background: var(--arena); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .medidor span { display: block; height: 100%; background: var(--bosque); border-radius: 99px; transform-origin: left; animation: llenar .9s var(--curva) both .15s; }

  .suave { color: var(--suave); font-size: 14.5px; }
  p.suave { max-width: 64ch; }
  label { display: block; font-weight: 600; font-size: 14.5px; margin: 16px 0 6px; color: var(--texto); }
  .opc { font-weight: 400; color: var(--suave); }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=time], input[type=number], input[type=tel], textarea, select {
    width: 100%; min-height: 48px; padding: 11px 14px; border: 1px solid var(--campo); border-radius: var(--radio-s); font: inherit; font-size: 16px;
    background: #fff; color: var(--texto); transition: border-color .15s, box-shadow .15s; -webkit-appearance: none; appearance: none;
  }
  input[type=date], input[type=time] { font-variant-numeric: tabular-nums; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--musgo) 50%), linear-gradient(135deg, var(--musgo) 50%, transparent 50%);
           background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 38px; }
  textarea { min-height: 112px; resize: vertical; line-height: 1.5; }
  input:hover, textarea:hover, select:hover { border-color: var(--salvia); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--bosque); box-shadow: 0 0 0 3px rgba(29, 51, 40, .14); }
  input::placeholder, textarea::placeholder { color: #9aa192; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .fecha-hora { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; }

  /* Botones: radio menor que las tarjetas, mayor que las insignias */
  button { font: inherit; font-weight: 600; font-size: 15px; border-radius: 10px; border: 1px solid transparent; padding: 11px 20px;
           min-height: 46px; cursor: pointer; position: relative; transition: transform .12s var(--curva), background .15s, color .15s, border-color .15s; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: none; box-shadow: var(--foco); }
  .primario { background: var(--bosque); color: var(--crema); }
  .primario:hover:not(:disabled) { background: var(--bosque-2); }
  .secundario { background: var(--papel); color: var(--bosque); border-color: var(--linea-2); }
  .secundario:hover:not(:disabled) { border-color: var(--bosque); background: #fff; }
  .exito { background: var(--ok); color: #fff; }
  .exito:hover:not(:disabled) { background: #2a5334; }
  .peligro { background: transparent; color: var(--mal); border-color: #e2bab2; }
  .peligro:hover:not(:disabled) { background: var(--mal-clara); border-color: var(--mal); }
  .peligro-lleno { background: var(--mal); color: #fff; }
  .peligro-lleno:hover:not(:disabled) { background: #8d3c32; }
  .enlace { background: none; border: none; color: inherit; text-decoration: underline; text-decoration-color: var(--oro); text-underline-offset: 3px;
            padding: 0; min-height: 0; font-weight: 500; font-size: 14.5px; border-radius: 4px; }
  button.ocupado { color: transparent !important; pointer-events: none; }
  button.ocupado::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
                          border: 2px solid; border-color: var(--crema) var(--crema) transparent transparent; animation: girar .7s linear infinite; }
  .secundario.ocupado::after, .peligro.ocupado::after { border-color: var(--bosque) var(--bosque) transparent transparent; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

  /* Pestañas: control segmentado con indicador que se desliza */
  .pestanas { position: relative; display: flex; gap: 2px; margin-bottom: 20px; overflow-x: auto; padding: 4px; background: var(--arena);
              border-radius: 12px; scrollbar-width: none; }
  .pestanas::-webkit-scrollbar { display: none; }
  .pestanas button { position: relative; z-index: 1; background: transparent; border: 0; color: var(--musgo); white-space: nowrap; flex: 0 0 auto;
                     min-height: 40px; padding: 8px 16px; font-size: 14.5px; font-weight: 600; border-radius: 9px; }
  .pestanas button:hover:not(.activa) { color: var(--bosque); background: rgba(253, 253, 250, .55); }
  .pestanas button.activa { color: var(--bosque); }
  .pestanas button:focus-visible { box-shadow: inset 0 0 0 2px var(--bosque); }
  .pestanas .indicador { position: absolute; left: 0; top: 0; z-index: 0; border-radius: 9px; background: var(--papel);
                         box-shadow: 0 1px 2px rgba(29, 51, 40, .1), 0 0 0 1px rgba(29, 51, 40, .06); pointer-events: none; }
  .pestanas .indicador.mov { transition: transform .34s var(--curva), width .34s var(--curva), height .34s var(--curva); }
  .pestanas.llenas button { flex: 1 1 0; }

  /* Insignias de estado */
  .insignia { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 9px; border-radius: 999px;
              font-family: var(--sans); font-size: 13px; font-weight: 600; white-space: nowrap; line-height: 1.5; letter-spacing: 0; }
  .insignia::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
  .ins-pend { background: var(--aviso-clara); color: var(--aviso); }
  .ins-ok { background: var(--ok-clara); color: var(--ok); }
  .ins-mal { background: var(--mal-clara); color: var(--mal); }
  .ins-gris { background: #e9ebe3; color: #596156; }
  .ins-exc { background: var(--bosque); color: #f0dcb0; margin-top: 8px; }
  .ins-exc::before { background: var(--oro); opacity: 1; }

  /* Semana del cuatrimestre: el elemento protagonista */
  .semana { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 22px; background: var(--bosque); color: var(--crema);
            border-radius: var(--radio); padding: 20px 24px 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
  .semana .num { font-family: var(--serif); font-size: 76px; font-weight: 400; color: var(--oro); line-height: .9; min-width: 0; text-align: left;
                 letter-spacing: -3px; font-variation-settings: "opsz" 144, "SOFT" 50; font-variant-numeric: lining-nums; }
  .semana .txt { font-size: 16px; min-width: 0; }
  .semana .txt strong { color: #fff; font-weight: 650; }
  .semana .txt .suave { color: rgba(245, 246, 240, .66); font-size: 14px; margin-top: 2px; }
  .semana .barras { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 14px; align-items: end; height: 22px; }
  .semana .barras span { height: 8px; border-radius: 2px; background: rgba(245, 246, 240, .14); }
  .semana .barras span.hecha { background: rgba(196, 160, 97, .55); }
  .semana .barras span.actual { background: var(--oro); height: 22px; }
  .semana:not(:has(.num)) { grid-template-columns: 1fr; }
  .semana.sin { background: var(--papel); color: var(--texto); border: 1px dashed var(--linea-2); }

  .opcion-exc { margin-top: 12px; padding: 14px 16px; border-radius: var(--radio-s); border: 1px solid #e3cf9f; background: var(--oro-clara); }
  .caja { border-radius: var(--radio-s); padding: 13px 16px; margin-top: 14px; font-size: 15px; border: 1px solid transparent; line-height: 1.55; }
  .caja.ok { background: var(--ok-clara); color: #234a2e; border-color: #c9dcc5; }
  .caja.mal { background: var(--mal-clara); color: #7f3128; border-color: #edc8bf; }
  .caja.info { background: #f1f3ea; color: var(--texto); border-color: var(--linea-2); }
  .caja.alerta { background: var(--aviso-clara); color: #5f4514; border-color: #e8d4a6; }
  .caja .acciones { margin-top: 16px; }

  /* Listas de solicitudes */
  .item { border-top: 1px solid var(--linea); padding: 16px 0; display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .item:first-of-type { border-top: none; padding-top: 4px; }
  .item:last-child { padding-bottom: 0; }
  .item-cuerpo { flex: 1; min-width: 0; }
  .item-cuerpo > .suave { margin-top: 2px; }
  .fechas { font-weight: 600; color: var(--bosque); font-variant-numeric: tabular-nums; }
  .fechas + .fechas { font-weight: 500; color: var(--texto); }
  .comentario { background: var(--crema); border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere;
                border-left: 2px solid var(--oro); color: var(--texto); max-width: 68ch; }
  .tabla-cont { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  th { font-size: 13px; color: var(--suave); font-weight: 600; white-space: nowrap; border-bottom-color: var(--linea-2); }
  tbody tr:hover { background: var(--crema); }

  /* Pantalla de acceso */
  .acceso { max-width: 520px; margin: 0 auto; }
  .hero { text-align: center; padding: 8px 0 28px; }
  .hero img { width: 172px; max-width: 56%; height: auto; display: inline-block; }
  .hero .lema { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 20px; color: var(--musgo); margin: 14px auto 0; max-width: 360px;
                line-height: 1.35; font-variation-settings: "opsz" 24, "SOFT" 50; text-wrap: balance; }
  .acceso .tarjeta { padding: 28px; }
  .acceso h2 { font-size: 30px; }

  .aviso { padding: 14px 0; border-top: 1px solid var(--linea); font-size: 15.5px; white-space: pre-wrap; }
  .aviso .suave { font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .aviso.nuevo { position: relative; padding-left: 18px; }
  .aviso.nuevo::before { content: ""; position: absolute; left: 0; top: 21px; width: 8px; height: 8px; border-radius: 50%; background: var(--oro); }
  .aviso:first-of-type { border-top: none; }
  .hijo { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; background: var(--crema); padding: 8px 16px 16px; border-radius: 12px; margin-top: 12px;
          border: 1px solid var(--linea); }
  .hijo label { margin-top: 10px; font-size: 14px; }
  .hijo .suave:last-child:not(:empty) { margin-top: 10px; }
  .hijo .titulo-hijo { grid-column: 1 / -1; font-family: var(--serif); font-weight: 500; color: var(--bosque); margin-top: 8px; font-size: 18px;
                       font-variation-settings: "opsz" 24, "SOFT" 50; }

  /* Estado de una lista: una franja de color a la izquierda del título, no un fondo teñido */
  .t-verde h3::before, .t-roja h3::before { content: ""; width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .t-verde h3::before { background: var(--ok); }
  .t-roja h3::before { background: var(--mal); }
  /* Tarjetas de aprobadas (verde) y rechazadas (rojo): el fondo permite distinguirlas de un vistazo */
  .t-verde { background: #eaf2e6; border-color: #c6d9be; }
  .t-roja { background: #f9e9e5; border-color: #ebc6bd; }
  .t-verde .item { border-color: #cfdfc8; }
  .t-roja .item { border-color: #efd0c8; }
  .t-verde .comentario, .t-roja .comentario { background: rgba(255, 255, 255, .75); }
  .t-roja .comentario { border-left-color: #d29a90; }
  .t-verde .comentario { border-left-color: var(--salvia); }

  /* Ventanas de confirmación */
  .modal-fondo { position: fixed; inset: 0; background: rgba(20, 33, 26, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20;
                 animation: fundido .18s ease both; -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .modal { background: var(--papel); border-radius: 18px; padding: 26px; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
           box-shadow: var(--sombra-alta); animation: emerger .26s var(--curva) both; }
  .modal-fondo.cierra { animation: fundido .16s ease reverse both; }
  .modal-texto { font-size: 15.5px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .leyenda span { padding: 3px 10px; border-radius: 6px; font-size: 13px; border: 1px solid rgba(0, 0, 0, .08); }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--bosque); color: var(--crema); padding: 13px 20px;
           border-radius: 12px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s var(--curva);
           width: max-content; max-width: calc(100vw - 32px); z-index: 30; box-shadow: var(--sombra-alta); }
  #toast.ver { opacity: 1; transform: translate(-50%, 0); }
  #toast.error { background: var(--mal); }

  /* Pantalla de carga sobre la app mientras el servidor responde */
  #carga { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px;
           background: rgba(236, 238, 229, .7); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
           opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility .18s ease; }
  #carga.ver { opacity: 1; visibility: visible; }
  .carga-caja { background: var(--papel); border-radius: 16px; padding: 24px 28px; min-width: 220px; max-width: 320px; text-align: center;
                box-shadow: var(--sombra-alta); transform: translateY(6px); transition: transform .26s var(--curva); }
  #carga.ver .carga-caja { transform: none; }
  .rueda { display: inline-block; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--arena);
           border-top-color: var(--bosque); animation: girar .8s linear infinite; }
  .carga-texto { margin-top: 12px; font-weight: 600; color: var(--bosque); font-size: 15px; }
  .carga-sub { margin-top: 2px; font-size: 13.5px; color: var(--suave); }
  /* Barra fina mientras se actualizan los datos al cambiar de pestaña */
  #actualizando { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #actualizando.ver { opacity: 1; }
  #actualizando::before { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: var(--oro); animation: barrido 1.1s ease-in-out infinite; }
  @keyframes barrido { from { left: -35%; } to { left: 100%; } }

  .cargando { text-align: center; color: var(--suave); padding: 80px 0; }
  .cargando img { width: 96px; height: auto; opacity: .8; }
  .cargando div { margin-top: 14px; font-size: 14.5px; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; color: var(--bosque); }
  details summary:focus-visible { outline: 2px solid var(--bosque); outline-offset: 3px; border-radius: 4px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; line-height: 1.5; }
  .check input { margin-top: 2px; width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--bosque); }
  .dias-check { display: flex; flex-wrap: wrap; gap: 8px; }
  .dias-check label { font-weight: 500; display: flex; gap: 8px; align-items: center; margin: 0; padding: 8px 14px 8px 10px; border: 1px solid var(--linea-2);
                      border-radius: 999px; background: #fff; cursor: pointer; }
  .dias-check label:has(input:checked) { border-color: var(--bosque); background: var(--salvia-clara); }
  .dias-check input { accent-color: var(--bosque); width: 18px; height: 18px; margin: 0; }
  .dato { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; font-size: 14.5px; margin-top: 10px; }
  [hidden] { display: none !important; }

  /* Mantenimiento */
  .ins-azul { background: #e3ebf0; color: #2c536b; }
  .opciones { display: grid; gap: 10px; margin-top: 6px; }
  .opciones.en-linea { display: flex; flex-wrap: wrap; gap: 10px 24px; }
  .opciones .check { margin: 0; }
  .opciones input[type=radio] { accent-color: var(--bosque); }
  .sub { font-weight: 500; font-size: 14px; color: var(--suave); }
  .dato-fijo { padding: 11px 14px; border-radius: var(--radio-s); background: var(--crema); border: 1px solid var(--linea); font-size: 15px; }
  .firma-caja { margin-top: 4px; }
  .firma-lienzo { display: block; width: 100%; height: 170px; background: #fff; border: 1px dashed var(--campo); border-radius: var(--radio-s);
                  touch-action: none; cursor: crosshair;
                  background-image: linear-gradient(var(--linea-2), var(--linea-2)); background-size: calc(100% - 48px) 1px;
                  background-position: 24px calc(100% - 40px); background-repeat: no-repeat; }
  .firma-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; font-size: 13.5px; }
  button.chico { min-height: 36px; padding: 6px 14px; font-size: 14px; border-radius: 8px; }
  .firma-ver img { display: block; max-width: 260px; width: 100%; height: auto; background: #fff; border: 1px solid var(--linea); border-radius: 8px; padding: 6px; }
  .mant-item { border-top: 1px solid var(--linea); padding: 18px 0; }
  .mant-item:first-of-type { border-top: none; padding-top: 4px; }
  .mant-item.urgente { border-left: 3px solid var(--mal); padding-left: 16px; margin-left: -4px; }
  .mant-enc { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .insignias { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .recorte { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 68ch; }
  .enviada { font-weight: 600; color: var(--bosque); }
  .seccion4 { border-top: 3px solid var(--bosque); }
  .seccion4 h3 { color: var(--bosque); }
  .dato dt { color: var(--suave); }
  .dato dd { margin: 0; }
  .cuenta { border-top: 1px solid var(--linea); padding: 16px 0; }
  .cuenta:first-of-type { border-top: none; padding-top: 4px; }
  .cuenta-enc { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
  a { color: var(--bosque); text-decoration-color: var(--oro); text-underline-offset: 3px; font-weight: 500; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible { outline: 2px solid var(--bosque); outline-offset: 2px; border-radius: 3px; }

  /* Movimiento: solo al responder a la persona (cambio de pestaña, abrir, confirmar) */
  @keyframes desdeDer { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes desdeIzq { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  @keyframes subir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
  @keyframes emerger { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes llenar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes girar { to { transform: rotate(360deg); } }
  .anim-der > * { animation: desdeDer .32s var(--curva) both; }
  .anim-izq > * { animation: desdeIzq .32s var(--curva) both; }
  .anim-subir > * { animation: subir .4s var(--curva) both; animation-delay: calc(var(--i, 0) * 40ms); }
  .semana .barras span.actual { animation: crecer .6s var(--curva) both .25s; transform-origin: bottom; }
  @keyframes crecer { from { transform: scaleY(.36); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
    .rueda, button.ocupado::after, #actualizando::before { animation-duration: 1.2s !important; }
  }

  @media (max-width: 600px) {
    main { padding: 20px 16px 88px; }
    header.barra { padding: 0 16px; height: 58px; }
    .marca img { height: 32px; }
    .marca-texto { padding-left: 10px; }
    .marca-texto strong { font-size: 17px; }
    .marca-texto span { display: none; }
    #usuario .nombre { display: none; }
    h2 { font-size: 30px; margin-bottom: 16px; }
    h3 { font-size: 20px; }
    .tarjeta { padding: 18px; border-radius: 14px; }
    .acceso .tarjeta { padding: 20px; }
    .fila2 { grid-template-columns: 1fr; }
    .rejilla { gap: 10px; }
    .tarjeta-dias { padding: 16px; grid-template-columns: 1fr; grid-template-areas: "et" "cifra" "fichas" "exc"; }
    .tarjeta-dias > .suave:first-child { font-size: 13.5px; line-height: 1.35; }
    .tarjeta-dias .fichas { margin: 10px 0 0; }
    .tarjeta-dias .exc-linea { font-size: 13px; }
    .cifra { font-size: 44px; }
    .semana { padding: 16px 18px 18px; gap: 2px 16px; }
    .semana .num { font-size: 60px; }
    .semana .barras { gap: 3px; height: 18px; }
    .semana .barras span.actual { height: 18px; }
    .acciones button { flex: 1 1 100%; }
    .pestanas.llenas.cuatro { display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
    .pestanas.llenas.cuatro button { padding: 8px 8px; }
    .pestanas.llenas.cuatro button:last-of-type:nth-of-type(odd) { grid-column: span 2; }
    .mant-enc .insignias { justify-content: flex-start; }
    .item { flex-direction: column; gap: 10px; }
    .item > button { width: 100%; }
    .hijo { grid-template-columns: 1fr; }
    .dato { grid-template-columns: 1fr; gap: 0; }
    .dato dt { margin-top: 8px; }
    .hero img { width: 148px; }
    .hero .lema { font-size: 18px; }
  }
</style>
</head>

// ---------------------------------------------------------------------------
// Animaciones de transición
// ---------------------------------------------------------------------------
const SIN_MOV = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/** Anima la entrada de una vista. Al cambiar de pestaña se desliza hacia el lado correspondiente;
 *  al entrar a una vista nueva sube con un fundido. Si solo se recargan datos, no se anima. */
function animar(clave, orden) {
  const prev = S.anim;
  S.anim = { clave: clave, orden: orden };
  let clase = null, cont = null;
  if (!prev || prev.clave.split(':')[0] !== clave.split(':')[0]) { clase = 'anim-subir'; cont = $('#app'); }
  else if (prev.clave !== clave) { clase = orden >= prev.orden ? 'anim-der' : 'anim-izq'; cont = $('#cuerpo'); }
  if (!clase || !cont || SIN_MOV) return;
  Array.from(cont.children).forEach((c, i) => c.style.setProperty('--i', Math.min(i, 6)));
  cont.classList.add(clase);
  setTimeout(() => cont.classList.remove(clase), 1200);
}

function posTab(b) { return { x: b.offsetLeft, y: b.offsetTop, w: b.offsetWidth, h: b.offsetHeight }; }
function ponerInd(ind, p) {
  ind.style.transform = 'translate(' + p.x + 'px, ' + p.y + 'px)';
  ind.style.width = p.w + 'px'; ind.style.height = p.h + 'px';
}
function guardarScroll(grupo) {
  const c = document.querySelector('.pestanas[data-grupo="' + grupo + '"]');
  if (c) S.scr[grupo] = c.scrollLeft;
}
/** Píldora que se desliza hasta la pestaña activa. */
function indicador(grupo) {
  const cont = document.querySelector('.pestanas[data-grupo="' + grupo + '"]');
  if (!cont) return;
  const act = cont.querySelector('button.activa');
  if (!act) return;
  cont.scrollLeft = S.scr[grupo] || 0;
  const ind = document.createElement('span');
  ind.className = 'indicador';
  cont.prepend(ind);
  const fin = posTab(act);
  const prev = S.ind[grupo];
  ponerInd(ind, prev || fin);
  S.ind[grupo] = fin;
  if (prev && !SIN_MOV && (prev.x !== fin.x || prev.y !== fin.y || prev.w !== fin.w)) {
    void ind.offsetWidth;
    ind.classList.add('mov');
    ponerInd(ind, fin);
  }
  if (cont.scrollWidth > cont.clientWidth) {
    const izq = act.offsetLeft - 12, der = act.offsetLeft + act.offsetWidth + 12;
    const modo = SIN_MOV ? 'auto' : 'smooth';
    if (izq < cont.scrollLeft) cont.scrollTo({ left: izq, behavior: modo });
    else if (der > cont.scrollLeft + cont.clientWidth) cont.scrollTo({ left: der - cont.clientWidth, behavior: modo });
  }
}
function reubicarIndicadores() {
  $$('.pestanas').forEach(c => {
    const a = c.querySelector('button.activa'), i = c.querySelector('.indicador');
    if (!a || !i) return;
    i.classList.remove('mov');
    const p = posTab(a);
    ponerInd(i, p);
    S.ind[c.dataset.grupo] = p;
  });
}
window.addEventListener('resize', reubicarIndicadores);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(reubicarIndicadores);

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function guardarToken(t) { try { t ? sessionStorage.setItem('bethany_t', t) : sessionStorage.removeItem('bethany_t'); } catch (e) {} }
function leerToken() { try { return sessionStorage.getItem('bethany_t'); } catch (e) { return null; } }

function api(fn, ...args) {
  return new Promise((ok, fallo) => {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(e => {
        const msg = String((e && e.message) || e);
        if (msg.indexOf('SESION:') !== -1) { salir(true); }
        fallo(new Error(msg.replace(/^.*SESION:\s*/, '').replace(/^Error:\s*/, '')));
      })[fn](...args);
  });
}

let toastTimer = null;
function toast(msg, error) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'ver' + (error ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 5000);
}

/** Ruedita de carga a pantalla completa. Admite llamadas anidadas: se oculta cuando termina la última. */
let cargasActivas = 0;
function mostrarCarga(texto) {
  cargasActivas++;
  const o = $('#carga');
  o.querySelector('.carga-texto').textContent = texto || 'Cargando…';
  o.classList.add('ver');
  o.setAttribute('aria-hidden', 'false');
}
function ocultarCarga() {
  cargasActivas = Math.max(0, cargasActivas - 1);
  if (cargasActivas) return;
  const o = $('#carga');
  o.classList.remove('ver');
  o.setAttribute('aria-hidden', 'true');
}
async function conCarga(texto, tarea) {
  mostrarCarga(texto);
  try { return await tarea(); } finally { ocultarCarga(); }
}

/** Desactiva el botón con su ruedita y, si se indica un texto, muestra también la carga a pantalla completa. */
async function conBoton(btn, tarea, texto) {
  if (btn) { btn.disabled = true; btn.classList.add('ocupado'); }
  if (texto) mostrarCarga(texto);
  try { await tarea(); } catch (e) { toast(e.message, true); } finally {
    if (texto) ocultarCarga();
    if (btn) { btn.disabled = false; btn.classList.remove('ocupado'); }
  }
}

function partes(ymd) { const p = ymd.split('-').map(Number); return { y: p[0], m: p[1], d: p[2] }; }
function utc(ymd) { const p = partes(ymd); return Date.UTC(p.y, p.m - 1, p.d); }
function fecha(ymd) {
  if (!ymd) return '';
  const p = partes(ymd); const ds = new Date(utc(ymd)).getUTCDay();
  return DIAS[ds].slice(0, 3) + ' ' + p.d + ' ' + MESES[p.m - 1].slice(0, 3) + ' ' + p.y;
}
function fechaHora(ymd, hora) { return fecha(ymd) + (hora ? ', ' + hora : ''); }
function nombreMes(clave) { const p = clave.split('-').map(Number); return MESES[p[1] - 1] + ' ' + p[0]; }
function mesDe(ymd) { return ymd.slice(0, 7); }
function mesSiguiente(clave) { const p = clave.split('-').map(Number); return p[1] === 12 ? (p[0] + 1) + '-01' : p[0] + '-' + String(p[1] + 1).padStart(2, '0'); }
function nochesPorMes(salida, regreso) {
  const res = {};
  for (let t = utc(salida); t < utc(regreso); t += 86400000) {
    const d = new Date(t);
    const k = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
    res[k] = (res[k] || 0) + 1;
  }
  return res;
}
function estaFuera(s, hoy) { return s.salida <= hoy && hoy < s.regreso; }
function edad(nac, hoy) {
  if (!nac) return '';
  const n = partes(nac), h = partes(hoy);
  let e = h.y - n.y;
  if (h.m < n.m || (h.m === n.m && h.d < n.d)) e--;
  return e;
}
function hoyLocal() {
  if (S.datos && S.datos.hoy) return S.datos.hoy;
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtCed(c) { c = String(c || ''); return /^\d{9}$/.test(c) ? c[0] + '-' + c.slice(1, 5) + '-' + c.slice(5) : c; }
function anos(n) { return n + (n === 1 ? ' año' : ' años'); }
function tok(n) { return n + (n === 1 ? ' token' : ' tokens'); }
function plural(n, s) { return n + ' ' + (n === 1 ? s : (/[aeiou]$/.test(s) ? s + 's' : s.replace(/ón$/, 'on') + 'es')); }
function salidaHtml(s) {
  return `<div class="fechas">Sale: ${fechaHora(s.salida, s.horaSalida)}</div><div class="fechas">Regresa: ${fechaHora(s.regreso, s.horaRegreso)}</div>`;
}

/** Ventana de confirmación. Con pedirEliminar, el botón principal se habilita solo al escribir ELIMINAR. */
function confirmar(o) {
  return new Promise(resolver => {
    const fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <h3>${esc(o.titulo)}</h3><div class="modal-texto">${o.html}</div>
      ${o.pedirEliminar ? `<label for="m-conf">Escribí <strong>ELIMINAR</strong> en mayúsculas para confirmar</label>
        <input id="m-conf" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">` : ''}
      ${o.pedirSi ? `<label for="m-conf">¿Estás segura o seguro? Escribí <strong>SÍ</strong> para confirmar</label>
        <input id="m-conf" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="4">` : ''}
      <div class="acciones"><button class="peligro-lleno" id="m-ok" ${o.pedirEliminar || o.pedirSi ? 'disabled' : ''}>${esc(o.ok)}</button>
        <button class="secundario" id="m-no">${esc(o.no)}</button></div></div>`;
    document.body.appendChild(fondo);
    const entrada = fondo.querySelector('#m-conf');
    const cerrar = v => { fondo.classList.add('cierra'); setTimeout(() => fondo.remove(), 170); resolver(v); };
    if (entrada) {
      entrada.focus();
      const valido = () => o.pedirSi ? /^s[ií]$/i.test(entrada.value.trim()) : entrada.value === 'ELIMINAR';
      entrada.addEventListener('input', () => { fondo.querySelector('#m-ok').disabled = !valido(); });
    }
    fondo.querySelector('#m-ok').onclick = () => cerrar(entrada ? entrada.value : true);
    fondo.querySelector('#m-no').onclick = () => cerrar(null);
  });
}

async function iniciar() {
  $('#logo-barra').src = LOGO.monoClaro;
  $('#app').innerHTML = `<div class="cargando"><img src="${LOGO.monoOsc}" alt=""><br><span class="rueda" style="margin-top:18px"></span><div>Cargando…</div></div>`;
  S.token = leerToken();
  if (!S.token) {
    let estado = null;
    try { estado = await api('estadoInstalacion'); } catch (e) {}
    return estado && estado.necesitaAdmin ? vistaInicial() : vistaAcceso('ingresar');
  }
  try { await cargar(); } catch (e) { vistaAcceso('ingresar'); }
}

async function cargar() {
  S.datos = await api('datosSesion', S.token);
  S.usuario = S.datos.usuario;
  pintarUsuario();
  redibujar();
}

/** Al cambiar de pestaña se piden los datos más recientes en segundo plano. Solo se vuelve a dibujar
 *  si cambiaron y si la persona no empezó a escribir en un formulario. */
let refrescando = false;
async function refrescarSilencioso() {
  if (refrescando || !S.token || !S.usuario) return;
  refrescando = true;
  $('#actualizando').classList.add('ver');
  const vista = S.anim && S.anim.clave;
  try {
    const nuevo = await api({ admin: 'datosAdmin', mant: 'datosMant' }[S.usuario.rol] || 'datosMama', S.token);
    if (!S.usuario || (S.anim && S.anim.clave) !== vista) return;
    if (JSON.stringify(nuevo) === JSON.stringify(S.datos)) return;
    S.datos = nuevo;
    if (S.editando || S.tocado) return;
    redibujar();
  } catch (e) { /* sin conexión: se queda con los datos que ya tenía */ } finally { refrescando = false; $('#actualizando').classList.remove('ver'); }
}
document.addEventListener('input', ev => { if (ev.target.closest && ev.target.closest('#cuerpo')) S.editando = true; });
// Si la persona ya tocó, hizo clic, escribió o se desplazó después de cambiar de pestaña, no se vuelve a dibujar
// la vista en segundo plano (evita clics en el lugar equivocado y saltos de la pantalla).
['pointerdown', 'keydown', 'wheel', 'touchmove'].forEach(tipo =>
  document.addEventListener(tipo, () => { if (S.usuario) S.tocado = true; }, { passive: true, capture: true }));

/** Dibuja la vista que corresponde al perfil: administración, personal de mantenimiento o mamá. */
function redibujar() {
  const r = S.usuario && S.usuario.rol;
  if (r === 'admin') vistaAdmin(); else if (r === 'mant') vistaMant(); else vistaMama();
}

function pintarUsuario() {
  const u = S.usuario;
  document.body.classList.toggle('con-sesion', !!u);
  $('.marca-texto span').textContent = u && u.rol === 'admin' ? 'Administración' : u && u.rol === 'mant' ? 'Personal de mantenimiento'
    : u ? 'Salidas y mantenimiento' : 'Salidas de fin de semana';
  $('#usuario').innerHTML = u ? `<span class="nombre">${esc(u.nombre)}</span>
    <button class="salir" id="btn-salir">Cerrar sesión</button>` : '';
  const b = $('#btn-salir');
  if (b) b.onclick = () => salir(false);
}

function salir(vencida) {
  if (S.token && !vencida) google.script.run.cerrarSesion(S.token);
  Object.assign(S, { token: null, usuario: null, datos: null, tab: 'pendientes', tabMama: 'solicitar', mesRegistro: null,
                     estadoRegistro: 'Aprobada', soloFuera: false, borrador: null, usarExc: false, ind: {}, scr: {},
                     borradorMant: null, mantId: null, filtroMant: 'abiertas', tabMant: 'boletas' });
  guardarToken(null);
  pintarUsuario();
  vistaAcceso('ingresar');
  if (vencida) toast('Tu sesión venció. Ingresá de nuevo.', true);
}

function formPerfil(p) {
  p = p || { hijos: [] };
  const v = x => esc(x == null ? '' : x);
  return `
    <h4>Datos personales</h4>
    <label for="p-cedula">Cédula <span class="opc">9 dígitos, por ejemplo 1-0234-0567, o DIMEX</span></label>
    <input id="p-cedula" type="text" inputmode="numeric" maxlength="20" placeholder="1-0234-0567" value="${v(fmtCed(p.cedula))}">
    <label for="p-nombre">Nombre completo</label><input id="p-nombre" type="text" maxlength="120" autocomplete="name" value="${v(p.nombre)}">
    <div class="fila2">
      <div><label for="p-nac">Fecha de nacimiento</label><input id="p-nac" type="date" value="${v(p.fechaNacimiento)}"></div>
      <div><label for="p-tel">Número de teléfono</label><input id="p-tel" type="tel" inputmode="tel" maxlength="30" autocomplete="tel" placeholder="8888 8888" value="${v(p.telefono)}"></div>
    </div>
    <h4>Universidad</h4>
    <label for="p-uni">Universidad</label><input id="p-uni" type="text" maxlength="150" value="${v(p.universidad)}">
    <label for="p-carrera">Carrera que cursás</label><input id="p-carrera" type="text" maxlength="150" value="${v(p.carrera)}">
    <div class="fila2">
      <div><label for="p-beca">Porcentaje de beca (%) <span class="opc">0 si no tenés</span></label><input id="p-beca" type="number" inputmode="decimal" min="0" max="100" step="any" value="${v(p.beca)}"></div>
      <div><label for="p-cuatri">Cuatrimestres cursados</label><input id="p-cuatri" type="number" inputmode="numeric" min="0" max="40" step="1" value="${v(p.cuatrimestres)}"></div>
    </div>
    <h4>Hijos e hijas</h4>
    <label for="p-nhijos">Cantidad de hijos e hijas</label><input id="p-nhijos" type="number" inputmode="numeric" min="0" max="15" step="1" value="${p.hijos.length}" style="max-width:140px">
    <div id="p-hijos"></div>`;
}

function conectarPerfil(p) {
  let hijos = ((p && p.hijos) || []).map(h => Object.assign({}, h));
  const pintar = () => {
    $('#p-hijos').innerHTML = hijos.map((h, i) => `
      <div class="hijo">
        <div class="titulo-hijo">Hijo o hija #${i + 1}</div>
        <div><label for="h-n${i}">Nombre completo</label><input id="h-n${i}" data-h="${i}" data-c="nombre" type="text" maxlength="120" value="${esc(h.nombre || '')}"></div>
        <div><label for="h-c${i}">Cédula</label><input id="h-c${i}" data-h="${i}" data-c="cedula" type="text" inputmode="numeric" maxlength="20" placeholder="1-0234-0567" value="${esc(fmtCed(h.cedula))}"></div>
        <div><label for="h-f${i}">Fecha de nacimiento</label><input id="h-f${i}" data-h="${i}" data-c="fechaNacimiento" type="date" max="${hoyLocal()}" value="${esc(h.fechaNacimiento || '')}"></div>
        <div><label for="h-g${i}">Género</label><select id="h-g${i}" data-h="${i}" data-c="genero">
          <option value="">Elegí…</option>${GENEROS.map(g => `<option ${h.genero === g ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
        <div class="suave" style="grid-column:1/-1" id="h-e${i}">${h.fechaNacimiento ? 'Edad: ' + anos(edad(h.fechaNacimiento, hoyLocal())) : ''}</div>
      </div>`).join('');
    $$('#p-hijos [data-h]').forEach(el => el.addEventListener('input', () => {
      hijos[el.dataset.h][el.dataset.c] = el.value;
      if (el.dataset.c === 'fechaNacimiento') {
        const e = el.value ? edad(el.value, hoyLocal()) : '';
        $('#h-e' + el.dataset.h).textContent = el.value && e >= 0 ? 'Edad: ' + anos(e) : '';
      }
    }));
  };
  $('#p-nhijos').addEventListener('input', e => {
    const n = Math.max(0, Math.min(15, parseInt(e.target.value, 10) || 0));
    while (hijos.length < n) hijos.push({ nombre: '', cedula: '', fechaNacimiento: '', genero: '' });
    hijos = hijos.slice(0, n);
    pintar();
  });
  pintar();
  return () => ({
    cedula: $('#p-cedula').value, nombre: $('#p-nombre').value, fechaNacimiento: $('#p-nac').value, telefono: $('#p-tel').value,
    universidad: $('#p-uni').value, carrera: $('#p-carrera').value, beca: $('#p-beca').value,
    cuatrimestres: $('#p-cuatri').value,
    hijos: hijos.map(h => ({ nombre: h.nombre || '', cedula: h.cedula || '', fechaNacimiento: h.fechaNacimiento || '', genero: h.genero || '' }))
  });
}

    <p class="lema">Acompañamos, fortalecemos y abrimos camino a nuevas oportunidades</p></div>
  <div class="acceso">
    <div class="pestanas llenas" data-grupo="acceso">
      <button class="${ingresar ? 'activa' : ''}" data-modo="ingresar">Ingresar</button>
      <button class="${ingresar ? '' : 'activa'}" data-modo="registro">Crear cuenta</button>
    </div>
    <div id="cuerpo"><div class="tarjeta">
    ${ingresar ? `
      <h2>Ingresar</h2>
      <form id="f-acceso">
        <label for="a-correo">Cédula, nombre de usuario o correo</label><input id="a-correo" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="a-clave">Contraseña</label><input id="a-clave" type="password" autocomplete="current-password" required>
        <div class="acciones"><button class="primario" type="submit">Ingresar</button></div>
      </form>
      <p class="suave">¿Olvidaste tu contraseña? Pedile a la administración una contraseña temporal.</p>`
    : `
      <h2>Crear cuenta de mamá residente</h2>
      <p class="suave">Todos los campos son obligatorios.</p>
      <form id="f-registro" novalidate>
        <h4>Datos de acceso</h4>
        <label for="r-usuario">Nombre de usuario <span class="opc">para ingresar a la app</span></label>
        <input id="r-usuario" type="text" maxlength="30" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="por ejemplo: ana.mora">
        <div class="suave">De 3 a 30 caracteres: letras, números, punto, guion o guion bajo, sin espacios ni tildes. También vas a poder ingresar con tu cédula o tu correo.</div>
        <label for="r-correo">Correo</label><input id="r-correo" type="email" autocomplete="email">
        <label class="check" style="margin-top:10px"><input id="r-avisos" type="checkbox" checked>
          <span>Quiero recibir un correo cuando aprueben, rechacen o anulen mis solicitudes.</span></label>
        <div class="fila2">
          <div><label for="r-clave">Contraseña <span class="opc">mín. 8</span></label><input id="r-clave" type="password" autocomplete="new-password"></div>
          <div><label for="r-clave2">Repetir contraseña</label><input id="r-clave2" type="password" autocomplete="new-password"></div>
        </div>
        ${formPerfil()}
        <label class="check" style="margin-top:18px"><input id="r-ok" type="checkbox">
          <span>Acepto que Proyecto Bethany registre mis datos, los de mis hijos y mis solicitudes de salida para administrar los permisos del hogar. Solo la administración puede verlos y puedo pedir que se corrijan o eliminen (Ley N.º 8968).</span></label>
        <div class="acciones"><button class="primario" type="submit">Crear cuenta</button></div>
      </form>
      <p class="suave">La administración debe activar tu cuenta antes de que puedas ingresar.</p>`}
    </div></div>
  </div>`;
  indicador('acceso');
  animar('acceso:' + modo, ingresar ? 0 : 1);
  $$('[data-modo]').forEach(b => b.onclick = () => vistaAcceso(b.dataset.modo));
  if (ingresar) {
    $('#f-acceso').onsubmit = ev => {
      ev.preventDefault();
      conBoton(ev.submitter, async () => {
        const r = await api('iniciarSesion', $('#a-correo').value, $('#a-clave').value);
        S.token = r.token; guardarToken(r.token);
        await cargar();
      }, 'Ingresando…');
    };
  } else {
    const leer = conectarPerfil();
    $('#f-registro').onsubmit = ev => {
      ev.preventDefault();
      if ($('#r-clave').value.length < 8) return toast('La contraseña debe tener al menos 8 caracteres.', true);
      if ($('#r-clave').value !== $('#r-clave2').value) return toast('Las contraseñas no coinciden.', true);
      if (!$('#r-ok').checked) return toast('Debés aceptar el uso de tus datos para crear la cuenta.', true);
      conBoton(ev.submitter, async () => {
        const datos = Object.assign(leer(), { usuario: $('#r-usuario').value, avisosCorreo: $('#r-avisos').checked,
                                              correo: $('#r-correo').value, clave: $('#r-clave').value, consentimiento: true });
        const msg = await api('registrar', datos);
        vistaAcceso('ingresar');
        toast(msg);
      }, 'Creando tu cuenta…');
    };
  }
}

// ---------------------------------------------------------------------------
// Vista de la mamá
// ---------------------------------------------------------------------------
function usoMes(mes) { return (S.datos.usos && S.datos.usos[mes]) || { normal: 0, excepcion: 0 }; }
function tokensLibres(mes) { return Math.max(S.datos.tokens - usoMes(mes).normal, 0); }
function excLibres(mes) { return Math.max(S.datos.excepcion - usoMes(mes).excepcion, 0); }
const insExc = '<span class="insignia ins-exc">Token de excepción</span>';

/** Banner con la semana del cuatrimestre (lo ven mamás y administración). */
function semanaHtml(c, esAdmin) {
  if (!c || c.estado === 'sin_fechas') {
    return esAdmin ? `<div class="semana sin"><div class="txt">Todavía no se registraron las fechas del cuatrimestre.
      <div class="suave" style="color:var(--suave)">Registralas en «Configuración» para que todas vean en qué semana están.</div></div></div>` : '';
  }
  if (c.estado === 'antes') {
    return `<div class="semana"><div class="txt">El cuatrimestre empieza el <strong>${fecha(c.inicio)}</strong>
      <div class="suave">${c.faltan === 1 ? 'Falta 1 día' : 'Faltan ' + c.faltan + ' días'}</div></div></div>`;
  }
  if (c.estado === 'terminado') {
    return `<div class="semana"><div class="txt">El cuatrimestre terminó el <strong>${fecha(c.fin)}</strong>
      <div class="suave">${esAdmin ? 'Registrá las fechas del próximo cuatrimestre en «Configuración».' : 'La administración registrará las fechas del próximo cuatrimestre.'}</div></div></div>`;
  }
  const barras = Array.from({ length: c.total }, (_, i) => `<span class="${i + 1 < c.semana ? 'hecha' : i + 1 === c.semana ? 'actual' : ''}"></span>`).join('');
  return `<div class="semana"><div class="num">${c.semana}</div>
    <div class="txt">${esAdmin ? 'Las mamás se encuentran' : 'Te encuentras'} en <strong>semana #${c.semana}</strong> del cuatrimestre
      <div class="suave">Del ${fecha(c.inicio)} al ${fecha(c.fin)} · ${c.total} semanas</div>
      <div class="barras" aria-hidden="true">${barras}</div></div></div>`;
}

function vistaMama() {
  const d = S.datos;
  if (!d.perfil.completo) S.tabMama = 'perfil';
  const nuevos = d.avisos.filter(a => !a.leido).length;
  const tabs = [['solicitar', 'Solicitar'], ['salidas', 'Mis salidas' + (d.pendientes.length ? ` (${d.pendientes.length})` : '')],
                ['mantenimiento', 'Mantenimiento'], ['notificaciones', 'Notificaciones' + (nuevos ? ` (${nuevos})` : '')], ['perfil', 'Mi perfil']];
  const cuerpo = { solicitar: mamaSolicitar, salidas: mamaSalidas, mantenimiento: mamaMantenimiento, notificaciones: mamaNotificaciones, perfil: mamaPerfil }[S.tabMama];
  guardarScroll('mama');
  $('#app').innerHTML = `
    <h2>Hola, ${esc(d.usuario.nombre.split(' ')[0])}</h2>
    ${semanaHtml(d.cuatri, false)}
    ${nuevos && S.tabMama !== 'notificaciones' ? `<div class="caja alerta" style="margin:0 0 14px">Tenés ${plural(nuevos, 'notificación')} sin leer. Revisalas en «Notificaciones».</div>` : ''}
    <div class="pestanas llenas cuatro" data-grupo="mama">${tabs.map(t => `<button data-tabm="${t[0]}" class="${S.tabMama === t[0] ? 'activa' : ''}">${esc(t[1])}</button>`).join('')}</div>
    <div id="cuerpo">${cuerpo.html()}</div>`;
  indicador('mama');
  S.editando = false; S.tocado = false;
  animar('mama:' + S.tabMama, tabs.findIndex(t => t[0] === S.tabMama));
  $$('[data-tabm]').forEach(b => b.onclick = () => {
    if (!d.perfil.completo && b.dataset.tabm !== 'perfil') return toast('Primero completá tu perfil.', true);
    S.tabMama = b.dataset.tabm; vistaMama(); window.scrollTo({ top: 0, behavior: SIN_MOV ? 'auto' : 'smooth' });
    refrescarSilencioso();
  });
  cuerpo.conectar();
}

const mamaSolicitar = {
  html() {
    const d = S.datos;
    const mesHoy = mesDe(d.hoy), mesSig = mesSiguiente(mesHoy);
    const b = S.borrador || { salida: '', horaSalida: '', regreso: '', horaRegreso: '', comentario: '' };
    return `
    <div class="rejilla">
      ${[mesHoy, mesSig].map(m => `<div class="tarjeta tarjeta-dias"><div class="suave">Tokens disponibles en ${nombreMes(m)}</div>
        <div class="cifra">${tokensLibres(m)} <span class="suave">de ${d.tokens}</span></div>
        <div class="fichas" aria-hidden="true">${Array.from({ length: d.tokens }, (_, i) => `<span class="${i < usoMes(m).normal ? 'usada' : ''}"></span>`).join('')}</div>
        ${d.excepcion ? `<div class="exc-linea">Token de excepción: <strong>${excLibres(m) ? (d.excepcion > 1 ? excLibres(m) + ' de ' + d.excepcion + ' disponibles' : 'disponible') : 'usado'}</strong></div>` : ''}
      </div>`).join('')}
    </div>
    <div class="tarjeta">
      <h3>Nueva solicitud de salida</h3>
      <p class="suave">La salida debe iniciar un ${d.diasSalida.map(n => DIAS[n]).join(' o ')}. Cada salida usa <strong>1 token</strong> del mes en que sale, sin importar cuántos días dure. Las solicitudes pendientes ya usan su token; si se rechazan o se cancelan, el token se devuelve.${d.excepcion ? ' Si ya usaste todos tus tokens del mes, podés usar tu token de excepción.' : ''}</p>
      <label for="s-salida">Salida: fecha y hora</label>
      <div class="fecha-hora"><input id="s-salida" type="date" min="${d.hoy}" value="${esc(b.salida)}" aria-label="Fecha de salida">
        <input id="s-hsalida" type="time" value="${esc(b.horaSalida)}" aria-label="Hora de salida"></div>
      <label for="s-regreso">Regreso: fecha y hora</label>
      <div class="fecha-hora"><input id="s-regreso" type="date" min="${d.hoy}" value="${esc(b.regreso)}" aria-label="Fecha de regreso">
        <input id="s-hregreso" type="time" value="${esc(b.horaRegreso)}" aria-label="Hora de regreso"></div>
      <label for="s-coment">Comentario para la administración</label>
      <textarea id="s-coment" maxlength="500" placeholder="Por ejemplo: a dónde vas, con quién y si salís con tus hijos.">${esc(b.comentario)}</textarea>
      <div class="suave" id="s-cuenta">0/500</div>
      <div id="s-previa"></div>
      <div class="acciones"><button class="primario" id="btn-revisar">Revisar solicitud</button></div>
      <div id="s-confirmar"></div>
    </div>`;
  },
  conectar() {
    const d = S.datos;
    const campos = ['#s-salida', '#s-hsalida', '#s-regreso', '#s-hregreso', '#s-coment'];
    const leer = () => ({ salida: $('#s-salida').value, horaSalida: $('#s-hsalida').value, regreso: $('#s-regreso').value,
                          horaRegreso: $('#s-hregreso').value, comentario: $('#s-coment').value });
    const previa = () => {
      const f = leer();
      S.borrador = f;
      $('#s-cuenta').textContent = f.comentario.length + '/500';
      $('#s-confirmar').innerHTML = '';
      const caja = $('#s-previa');
      if (!f.salida || !f.regreso) { caja.innerHTML = ''; return null; }
      let error = '';
      if (f.regreso <= f.salida) error = 'La fecha de regreso debe ser posterior a la de salida.';
      else if (d.diasSalida.length && d.diasSalida.indexOf(new Date(utc(f.salida)).getUTCDay()) === -1) {
        error = 'La salida debe iniciar un ' + d.diasSalida.map(n => DIAS[n]).join(' o ') + '.';
      }
      if (error) { caja.innerHTML = `<div class="caja mal">${esc(error)}</div>`; return null; }
      const pedidas = nochesPorMes(f.salida, f.regreso);
      let total = 0;
      Object.keys(pedidas).forEach(m => { total += pedidas[m]; });
      const m = mesDe(f.salida), libres = tokensLibres(m), exc = excLibres(m);
      const marcada = S.usarExc === true;
      if (libres) {
        caja.innerHTML = `<div class="caja info">Esta salida (${plural(total, 'día')}) usa <strong>1 token de ${nombreMes(m)}</strong>.
          ${libres - 1 ? 'Te ' + (libres - 1 === 1 ? 'quedaría 1 token' : 'quedarían ' + (libres - 1) + ' tokens') + ' ese mes.' : 'Es tu último token de ese mes.'}</div>`;
        return Object.assign(f, { total: total, usarExcepcion: false });
      }
      if (!exc) {
        caja.innerHTML = `<div class="caja mal">Ya usaste ${d.tokens === 1 ? 'tu token' : 'tus ' + tok(d.tokens)}${d.excepcion ? ' y tu token de excepción' : ''} de ${nombreMes(m)}.
          Si una solicitud pendiente se rechaza o la cancelás, el token se devuelve.</div>`;
        return null;
      }
      caja.innerHTML = `<div class="caja alerta">Ya usaste ${d.tokens === 1 ? 'tu token' : 'tus ' + tok(d.tokens)} de ${nombreMes(m)}.</div>
        <label class="check opcion-exc"><input type="checkbox" id="s-exc" ${marcada ? 'checked' : ''}>
          <span><strong>Usar mi token de excepción</strong> para esta salida (${plural(total, 'día')}). La administración verá que es una solicitud con token de excepción.</span></label>`;
      $('#s-exc').onchange = e => { S.usarExc = e.target.checked; $('#s-confirmar').innerHTML = ''; };
      return Object.assign(f, { total: total, usarExcepcion: marcada, pideExcepcion: true });
    };
    campos.forEach(id => $(id).addEventListener('input', previa));
    previa();
    $('#btn-revisar').onclick = () => {
      const p = previa();
      if (!p) return toast('Revisá las fechas de la solicitud.', true);
      if (p.pideExcepcion && !p.usarExcepcion) return toast('Ya no te quedan tokens ese mes. Marcá «Usar mi token de excepción» para continuar.', true);
      if (!p.horaSalida || !p.horaRegreso) return toast('Indicá la hora de salida y la hora de regreso.', true);
      const coment = p.comentario.trim();
      if (coment.length < 5) { $('#s-coment').focus(); return toast('El comentario para la administración es obligatorio.', true); }
      $('#s-confirmar').innerHTML = `<div class="caja info">
        <strong>Confirmá tu solicitud</strong><br>
        Sale: ${fechaHora(p.salida, p.horaSalida)}<br>Regresa: ${fechaHora(p.regreso, p.horaRegreso)}<br>Días: ${p.total}<br>
        Usa: ${p.usarExcepcion ? '<strong>tu token de excepción</strong>' : '1 token de ' + nombreMes(mesDe(p.salida))}<br>
        Comentario: ${esc(coment)}
        <div class="acciones"><button class="primario" id="btn-enviar">Enviar a la administración</button>
        <button class="secundario" id="btn-editar">Editar</button></div></div>`;
      $('#s-confirmar').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      $('#btn-editar').onclick = () => { $('#s-confirmar').innerHTML = ''; };
      $('#btn-enviar').onclick = ev => conBoton(ev.currentTarget, async () => {
        const msg = await api('enviarSolicitud', S.token, { salida: p.salida, horaSalida: p.horaSalida, regreso: p.regreso,
                                                            horaRegreso: p.horaRegreso, comentario: coment, usarExcepcion: p.usarExcepcion });
        S.borrador = null; S.usarExc = false; S.tabMama = 'salidas';
        toast(msg);
        await cargar();
      }, 'Enviando tu solicitud…');
    };
  }
};

    });

};

const mamaPerfil = {
  html() {
    const p = S.datos.perfil;

    return `
    ${p.completo ? '' : `<div class="caja alerta" style="margin:0 0 14px">Completá tu perfil para poder enviar solicitudes.${(p.faltan || []).length ? '<br>Falta: ' + esc(p.faltan.join('; ')) + '.' : ''}</div>`}

      ${formPerfil(Object.assign({ nombre: S.datos.usuario.nombre, telefono: S.datos.usuario.telefono }, p, { cedula: p.cedula }))}
      <div class="acciones"><button class="primario" id="btn-perfil">Guardar perfil</button></div>

}

function vistaAdmin() {
  const d = S.datos;
  const porActivar = d.usuarios.filter(u => u.estado === 'Pendiente').length;
  const nuevasMant = (d.mantenimiento || []).filter(m => m.estado === 'Pendiente').length;
  const tabs = [
    ['pendientes', 'Pendientes' + (d.pendientes.length ? ` (${d.pendientes.length})` : '')],
    ['registro', 'Registro de salidas'],
    ['mantenimiento', 'Mantenimiento' + (nuevasMant ? ` (${nuevasMant} ${nuevasMant === 1 ? 'nueva' : 'nuevas'})` : '')],
    ['cuentas', 'Cuentas' + (porActivar ? ` (${porActivar} por activar)` : '')],
    ['config', 'Configuración'],
    ['excel', 'Excel']
  ];
  const cuerpo = { pendientes: adminPendientes, registro: adminRegistro, mantenimiento: adminMantenimiento, cuentas: adminCuentas, config: adminConfig, excel: adminExcel }[S.tab];
  guardarScroll('admin');
  $('#app').innerHTML = `
    ${semanaHtml(d.cuatri, true)}
    <div class="pestanas" data-grupo="admin">${tabs.map(t => `<button data-tab="${t[0]}" class="${S.tab === t[0] ? 'activa' : ''}">${esc(t[1])}</button>`).join('')}</div>
    <div id="cuerpo">${cuerpo.html()}</div>`;
  indicador('admin');
  S.editando = false; S.tocado = false;
  animar('admin:' + S.tab, tabs.findIndex(t => t[0] === S.tab));
  $$('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.mantId = null; vistaAdmin(); refrescarSilencioso(); });
  cuerpo.conectar();
}

      <div class="tarjeta">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div><h3 style="margin-bottom:2px">${esc(s.nombre)}</h3>
            <div class="suave">Cédula ${esc(fmtCed(s.cedula))}</div>
            <div class="suave">${s.telefono ? `<a href="tel:${esc(s.telefono.replace(/[^\d+]/g, ''))}">${esc(s.telefono)}</a> · ` : ''}${esc(s.correo)}</div>
            <div class="suave">Enviada ${esc(s.enviada)}</div></div>
          <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="insignia ins-pend">Pendiente</span>
            ${s.token === 'Excepción' ? insExc : ''}</div>
        </div>
        ${s.token === 'Excepción' ? `<div class="caja alerta"><strong>Esta mamá usó su token de excepción.</strong> Ya había usado todos sus tokens de ${nombreMes(s.saldo.mes)}.</div>` : ''}
        <div style="margin-top:10px">${salidaHtml(s)}</div>
        <div class="suave">${plural(s.dias, 'día')}${s.semana !== '' ? ' · sale en la semana ' + s.semana + ' del cuatrimestre' : ''}</div>
        <div class="suave">${nombreMes(s.saldo.mes)}: tiene aprobados ${s.saldo.normal} de ${tok(d.tokens)}${d.excepcion || s.saldo.excepcion ? ' y ' + s.saldo.excepcion + ' de ' + d.excepcion + ' de excepción' : ''}
          ${(s.token === 'Excepción' ? s.saldo.excepcion >= d.excepcion : s.saldo.normal >= d.tokens) ? ' <strong style="color:var(--mal)">(ya no le quedan, no se puede aprobar)</strong>' : ''}</div>
        <div class="comentario">${esc(s.comentario) || '<em>Sin comentario</em>'}</div>
        <label for="n-${esc(s.id)}">Nota para la mamá <span class="opc">(si rechazás, explicá el motivo)</span></label>
        <textarea id="n-${esc(s.id)}" maxlength="500" style="min-height:70px"></textarea>
        <div class="acciones">
          <button class="exito" data-decidir="aprobar" data-id="${esc(s.id)}">Aprobar</button>
          <button class="peligro" data-decidir="rechazar" data-id="${esc(s.id)}">Rechazar</button>
        </div>
      </div>`).join('');

  conectar() {
    $$('[data-decidir]').forEach(btn => btn.onclick = () => {
      const id = btn.dataset.id, dec = btn.dataset.decidir;
      if (dec === 'rechazar' && !confirm('Se rechazará la solicitud y se avisará a la mamá. ¿Continuar?')) return;
      conBoton(btn, async () => {
        toast(await api('decidir', S.token, id, dec, document.getElementById('n-' + id).value));
        await cargar();
      }, dec === 'aprobar' ? 'Aprobando la solicitud…' : 'Rechazando la solicitud…');
    });
  }
};

const adminRegistro = {
  html() {
    const d = S.datos;
    const base = S.estadoRegistro === 'Aprobada' ? d.aprobadas : d.rechazadas;
    const meses = new Set([mesDe(d.hoy)]);
    base.forEach(s => Object.keys(nochesPorMes(s.salida, s.regreso)).forEach(m => meses.add(m)));
    const lista = Array.from(meses).sort().reverse();
    if (!S.mesRegistro || lista.indexOf(S.mesRegistro) === -1) S.mesRegistro = mesDe(d.hoy);
    const soloFuera = S.soloFuera && S.estadoRegistro === 'Aprobada';
    const filas = base.filter(s => soloFuera ? estaFuera(s, d.hoy)
        : Object.prototype.hasOwnProperty.call(nochesPorMes(s.salida, s.regreso), S.mesRegistro))
      .sort((a, b) => a.salida < b.salida ? -1 : 1);
    const fueraHoy = d.aprobadas.filter(s => estaFuera(s, d.hoy)).length;
    const excMes = filas.filter(s => s.token === 'Excepción').length;
    return `<div class="tarjeta">
      <p class="suave" style="margin-top:0">La columna «Semana» indica en qué semana del cuatrimestre inicia cada salida.${excMes ? ` En esta lista hay ${plural(excMes, 'salida')} con token de excepción.` : ''}</p>
      <div class="fila2">
        <div><label for="r-estado">Mostrar</label><select id="r-estado">
          <option value="Aprobada" ${S.estadoRegistro === 'Aprobada' ? 'selected' : ''}>Aprobadas</option>
          <option value="Rechazada" ${S.estadoRegistro === 'Rechazada' ? 'selected' : ''}>Rechazadas</option></select></div>
        <div><label for="r-mes">Mes</label><select id="r-mes" ${soloFuera ? 'disabled' : ''}>${lista.map(m => `<option value="${m}" ${m === S.mesRegistro ? 'selected' : ''}>${nombreMes(m)}</option>`).join('')}</select></div>
      </div>
      ${S.estadoRegistro === 'Aprobada' ? `<label class="check" style="margin-top:12px"><input type="checkbox" id="r-fuera" ${soloFuera ? 'checked' : ''}> <span>Solo quienes están fuera hoy (${fueraHoy})</span></label>` : ''}
      <div class="tabla-cont" style="margin-top:12px"><table>
        <thead><tr><th>Mamá</th><th>Cédula</th><th>Teléfono</th><th>Sale</th><th>Regresa</th><th>Días</th><th>Semana</th><th>Token</th><th>Comentario</th><th>Revisada por</th><th></th></tr></thead>
        <tbody>${filas.length ? filas.map(s => `<tr>
          <td>${esc(s.nombre)}${S.estadoRegistro === 'Aprobada' && estaFuera(s, d.hoy) ? ' <span class="insignia ins-pend">Fuera hoy</span>' : ''}</td>
          <td style="white-space:nowrap">${esc(fmtCed(s.cedula))}</td><td style="white-space:nowrap">${esc(s.telefono)}</td>
          <td>${fechaHora(s.salida, s.horaSalida)}</td><td>${fechaHora(s.regreso, s.horaRegreso)}</td><td>${s.dias}</td>
          <td>${s.semana !== '' ? '#' + s.semana : '<span class="suave">—</span>'}</td>
          <td>${s.token === 'Excepción' ? insExc : 'Normal'}</td>
          <td>${esc(s.comentario)}${s.notaAdmin ? `<div class="suave">Nota: ${esc(s.notaAdmin)}</div>` : ''}</td>
          <td>${esc(s.revisadaPor)}<div class="suave">${esc(s.fechaRevision)}</div></td>
          <td>${S.estadoRegistro === 'Aprobada' && s.regreso >= d.hoy ? `<button class="peligro" data-anular="${esc(s.id)}">Anular</button>` : ''}</td></tr>`).join('')
        : '<tr><td colspan="11" class="suave">No hay salidas para este filtro.</td></tr>'}</tbody>
      </table></div></div>`;
  },
  conectar() {
    $('#r-estado').onchange = e => { S.estadoRegistro = e.target.value; vistaAdmin(); };
    const sel = $('#r-mes');

function descargarArchivo(r, tipo) {
  const bin = atob(r.base64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: tipo }));
  const a = document.createElement('a'); a.href = url; a.download = r.nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function esAdminMant() { return S.usuario && S.usuario.rol === 'admin'; }
const TIPO_DOCX = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const INS_MANT = { 'Pendiente': 'ins-gris', 'En proceso': 'ins-azul', 'En espera de materiales o repuestos': 'ins-pend', 'Finalizada': 'ins-ok' };
function insMant(estado) { return `<span class="insignia ${INS_MANT[estado] || 'ins-gris'}">${esc(estado)}</span>`; }
function enviadaTxt(v) { return v ? fechaHora(v.slice(0, 10), v.slice(11, 16)) : ''; }
function radios(nombre, opciones, valor) {
  return opciones.map(o => `<label class="check"><input type="radio" name="${nombre}" value="${esc(o[0])}" ${valor === o[0] ? 'checked' : ''}>
    <span>${esc(o[1])}</span></label>`).join('');
}
function radioValor(nombre) { const r = document.querySelector(`input[name="${nombre}"]:checked`); return r ? r.value : ''; }

/** Recuadro para firmar con el dedo o el mouse. */
function firmaHtml(id) {
  return `<div class="firma-caja"><canvas id="${id}" class="firma-lienzo" aria-label="Recuadro para firmar"></canvas>
    <div class="firma-pie"><span class="suave">Firmá con el dedo o con el mouse dentro del recuadro.</span>
      <button type="button" class="secundario chico" data-limpiar-firma="${id}">Borrar firma</button></div></div>`;
}
function conectarFirma(id) {
  const cv = document.getElementById(id);
  const ctx = cv.getContext('2d');
  let puntos = 0, dibujando = false, ult = null;
  const r0 = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r0.width * dpr)); cv.height = Math.max(1, Math.round(r0.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ctx.fillStyle = '#1f2e27';
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * r0.width / r.width, y: (e.clientY - r.top) * r0.height / r.height }; };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    dibujando = true; ult = pos(e); ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.3, 0, Math.PI * 2); ctx.fill(); puntos++;
  });
  cv.addEventListener('pointermove', e => {
    if (!dibujando) return; e.preventDefault();
    const p = pos(e); ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ult = p; puntos++;
  });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { dibujando = false; }));
  const limpiar = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.restore(); puntos = 0; };
  const b = document.querySelector(`[data-limpiar-firma="${id}"]`);
  if (b) b.onclick = limpiar;
  return {
    vacia: () => puntos < 8,
    limpiar,
    /** Recorta lo dibujado, lo pone sobre fondo blanco y lo reduce para que pese poco. */
    imagen() {
      const w = cv.width, h = cv.height, px = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
        if (px[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      if (x1 <= x0 || y1 <= y0) return '';
      const m = 12 * dpr; x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w, x1 + m); y1 = Math.min(h, y1 + m);
      for (const ancho of [480, 360, 260, 180]) {
        const f = Math.min(1, ancho / (x1 - x0));
        const o = document.createElement('canvas');
        o.width = Math.max(1, Math.round((x1 - x0) * f)); o.height = Math.max(1, Math.round((y1 - y0) * f));
        const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, o.width, o.height);
        c.drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, o.width, o.height);
        const url = o.toDataURL('image/png');
        if (url.length <= 45000) return url;
      }
      return '';
    }
  };
}

      <div class="acciones"><button class="primario" id="btn-m4">Guardar sección 4</button></div>

    $$('[data-borrar-boleta]').forEach(b => b.onclick = async () => {

          <div class="caja alerta">Ya no se verá en la app (ni para la mamá ni para el personal de mantenimiento) y no se podrá descargar en .docx.</div>
          <p class="suave">Su registro completo se conserva siempre en el Excel «Registro de mantenimiento».</p>` });
      if (!conf) return;
      try {

      descargarArchivo(await api('descargarMantenimientoDocx', S.token, b.dataset.docx), TIPO_DOCX);
    }, 'Preparando la boleta en Word…'));
    if (!S.mantId || !$('#btn-m4')) return;
    const id = S.mantId;
    $('#mt-volver').onclick = () => { S.mantId = null; redibujar(); };
    api('firmasMantenimiento', S.token, id).then(f => {
      if (S.mantId !== id) return;
      const ver = (sel, url) => { const el = $(sel); if (el) el.innerHTML = url ? `<img src="${url}" alt="Firma">` : '<span class="suave">Sin firma</span>'; };
      ver('#mt-firma-m', f.solicitante);
      ver('#m4-firma-actual', f.responsable);
    }).catch(() => {});
    let firma = $('#m4-firma-zona').hidden ? null : conectarFirma('m4-firma');
    const re = $('#m4-refirmar');
    if (re) re.onclick = () => { $('#m4-firma-zona').hidden = false; $('#m4-firma-actual').hidden = true; re.remove(); firma = conectarFirma('m4-firma'); };
    $('#btn-m4').onclick = ev => {
      const estado = radioValor('m4-estado');
      if (!estado) return toast('Elegí el estado de la solicitud.', true);
      const img = firma && !firma.vacia() ? firma.imagen() : '';
      conBoton(ev.currentTarget, async () => {
        toast(await api('guardarMantenimientoAdmin', S.token, id, {
          estado, prioridad: radioValor('m4-prio'), fechaRecepcion: $('#m4-recepcion').value, fechaAtencion: $('#m4-atencion').value,
          fechaFinalizacion: $('#m4-fin').value, evaluacion: $('#m4-eval').value, trabajo: $('#m4-trabajo').value,
          materiales: $('#m4-mat').value, responsable: $('#m4-resp').value, observaciones: $('#m4-obs').value, firmaResponsable: img
        }));
        await cargar();
      }, 'Guardando la sección 4…');
    };
  }
};

  const tabs = [['boletas', 'Boletas' + (nuevas ? ` (${nuevas} ${nuevas === 1 ? 'nueva' : 'nuevas'})` : '')], ['cuenta', 'Mi cuenta']];
  const cuerpo = S.tabMant === 'cuenta' ? mantCuenta : adminMantenimiento;

  $('#app').innerHTML = `
    <h2>Hola, ${esc(d.usuario.nombre.split(' ')[0])}</h2>

    <div id="cuerpo">${cuerpo.html()}</div>`;

  $$('[data-tabt]').forEach(b => b.onclick = () => { S.tabMant = b.dataset.tabt; S.mantId = null; vistaMant(); refrescarSilencioso(); });

        <div><label for="mc-correo">Correo</label><input id="mc-correo" type="email" value="${esc(u.correo)}"></div>
      </div>
      <div class="fila2">
        <div><label for="mc-usuario">Nombre de usuario</label><input id="mc-usuario" type="text" maxlength="30" autocapitalize="none" spellcheck="false" value="${esc(u.usuario)}"></div>
        <div><label for="mc-cedula">Cédula <span class="opc">opcional</span></label><input id="mc-cedula" type="text" inputmode="numeric" maxlength="16" placeholder="1-0234-0567" value="${esc(fmtCed(u.cedula))}"></div>
      </div>
      <div class="acciones"><button class="primario" id="btn-micuenta">Guardar mi cuenta</button></div></div>
      <div class="tarjeta">${formCambiarClave()}</div>`;
  },
  conectar() {
    $('#btn-micuenta').onclick = ev => conBoton(ev.currentTarget, async () => {
      const r = await api('actualizarCuentaAdmin', S.token, { nombre: $('#mc-nombre').value, correo: $('#mc-correo').value,
                                                              usuario: $('#mc-usuario').value, cedula: $('#mc-cedula').value });
      toast(r.mensaje);
      await cargar();
    }, 'Guardando tu cuenta…');
    conectarCambiarClave();
  }
};
